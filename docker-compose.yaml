services:
  warp:
    image: caomingjun/warp
    container_name: eca-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./warp-data:/var/lib/cloudflare-warp
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS https://www.cloudflare.com/cdn-cgi/trace | grep -q 'warp=on'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "8081:8081"


  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eca-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ses kanalında kimse kalmazsa kaç saniye sonra ayrılsın (0 = kapalı)
      - AUTO_LEAVE_SECONDS=${AUTO_LEAVE_SECONDS:-300}
      # Ayrılınca mesaj atılacak text kanalının ID'si (boşsa mesaj atılmaz)
      - AUTO_LEAVE_CHANNEL_ID=${AUTO_LEAVE_CHANNEL_ID:-}
      # Mesaj metni; {channel} = ses kanalı adı, {minutes} = süre (dk). Boşsa varsayılan mesaj
      - AUTO_LEAVE_MESSAGE=${AUTO_LEAVE_MESSAGE:-}
      # "Şimdi çalıyor" kartının atılacağı text kanalı (boşsa son müzik komutunun yazıldığı kanal)
      - NOW_PLAYING_CHANNEL_ID=${NOW_PLAYING_CHANNEL_ID:-}
      # Şarkılar arası geçiş süresi, sn (0 = kapalı, en fazla 12)
      - CROSSFADE_SECONDS=${CROSSFADE_SECONDS:-6}
      # Ses seviyesi eşitleme (0 = kapalı)
      - AUDIO_NORMALIZE=${AUDIO_NORMALIZE:-1}
      # Haftalık özet kanalı (boşsa NOW_PLAYING_CHANNEL_ID) ve saat dilimi
      - STATS_CHANNEL_ID=${STATS_CHANNEL_ID:-}
      - TIMEZONE=${TIMEZONE:-Europe/Istanbul}
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_healthy
      pot-provider:
        condition: service_started
    volumes:
      # Persist music and playlists
      - ./music:/app/music
      - ./playlists:/app/playlists
      # İstatistik veritabanı (stats.db) deploy'lar arasında korunsun
      - ./data:/app/data
      # Cookies directory
      - ./cookies:/app/cookies
      # YouTube cookies (optional - only if you have cookies.txt file)
      # Uncomment the line below if you have a cookies.txt file
      # - ./cookies.txt:/app/cookies.txt
      # yt-dlp cache (player signature functions etc. - persists across restarts)
      - ./ytdlp-cache:/root/.cache/yt-dlp
      - /data/coolify/app-data/cookies.txt:/app/cookies.txt


  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: eca-pot-provider
    restart: unless-stopped
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
